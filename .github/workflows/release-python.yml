name: Release Python Wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload wheels to, for example v0.8.0-alpha.2"
        required: true
        type: string
      source_ref:
        description: "Git ref to build from"
        required: true
        default: "main"
        type: string
      publish_to_pypi:
        description: "Publish wheels to PyPI after checks pass"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025-vs2026

    defaults:
      run:
        shell: bash

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref }}

      - name: Read version from tag
        id: version
        run: |
          RELEASE_TAG="${{ inputs.release_tag }}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must start with v."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify Python package version matches tag
        run: python scripts/release-version.py check --version "${{ steps.version.outputs.version }}"

      - name: Verify FFI publish surface
        run: python scripts/verify-ffi-publish-surface.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build and smoke wheel
        run: python scripts/build-python-uniffi-wheel.py --run-smoke

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade auditwheel
          mkdir -p target/python-wheels/repaired
          python -m auditwheel repair target/python-wheels/merman-*.whl --wheel-dir target/python-wheels/repaired
          rm target/python-wheels/merman-*.whl
          mv target/python-wheels/repaired/merman-*.whl target/python-wheels/
          rmdir target/python-wheels/repaired

      - name: Run Python example
        run: PYTHONPATH=platforms/python/merman/src python platforms/python/merman/examples/smoke.py

      - name: Run final wheel install smoke
        run: |
          python -m venv target/python-final-wheel-smoke
          if [ -f target/python-final-wheel-smoke/Scripts/python.exe ]; then
            PYTHON=target/python-final-wheel-smoke/Scripts/python.exe
          else
            PYTHON=target/python-final-wheel-smoke/bin/python
          fi
          "$PYTHON" -m pip install --no-deps target/python-wheels/merman-*.whl
          "$PYTHON" - <<'PY'
          import merman


          class Measurer(merman.MermanTextMeasurer):
              def __init__(self):
                  self.calls = 0

              def measure(self, request):
                  self.calls += 1
                  return merman.MermanTextMeasureResult(
                      width=max(len(request.text) * 8.0, 1.0),
                      height=max(request.line_height, 1.0),
                      line_count=1,
                  )


          e = merman.MermanEngine()
          s = 'flowchart TD\nA[Hello] --> B[World]'
          assert e.abi_version() == 2
          assert e.render_svg(s, None).startswith('<svg')
          assert 'Hello' in e.render_ascii(s, None)
          assert e.validate(s, None).valid
          assert 'flowchart' in e.supported_diagrams()
          assert 'default' in e.supported_themes()
          assert any(item.diagram_type == 'flowchart' for item in e.diagram_family_capabilities())

          measurer = Measurer()
          reusable = e.reusable_engine_with_text_measurer(None, measurer)
          assert reusable.render_svg(s).startswith('<svg')
          assert measurer.calls > 0

          setter_measurer = Measurer()
          reusable = e.reusable_engine(None)
          reusable.set_text_measurer(setter_measurer)
          assert reusable.render_svg(s).startswith('<svg')
          calls_after_set = setter_measurer.calls
          assert calls_after_set > 0
          reusable.clear_text_measurer()
          assert reusable.render_svg(s).startswith('<svg')
          assert setter_measurer.calls == calls_after_set
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-wheel-${{ runner.os }}-${{ runner.arch }}
          path: target/python-wheels/merman-*.whl

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Download wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-wheel-*
          path: wheels
          merge-multiple: true

      - name: Check wheel metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check wheels/merman-*.whl

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" wheels/merman-*.whl --clobber
          else
            echo "::warning::GitHub Release $RELEASE_TAG does not exist yet; wheel artifacts were uploaded for manual attachment."
          fi

      - name: Publish to PyPI
        if: ${{ inputs.publish_to_pypi }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: wheels
          skip-existing: true
